<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web QR Scanner</title>
    <script src="https://jsdelivr.net" type="text/javascript"></script>
    <style>
        body { 
            margin: 0; padding: 20px; background: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box;
        }
        h2 { margin-bottom: 15px; font-weight: 500; font-size: 1.2rem; text-align: center; }
        #reader { 
            width: 100%; max-width: 450px; background: #1e1e1e; 
            border: 2px solid #333333 !important; border-radius: 12px; overflow: hidden;
        }
        #result-box {
            margin-top: 20px; padding: 12px; width: 100%; max-width: 450px;
            background: #2a2a2a; border-radius: 8px; text-align: center; display: none;
        }
    </style>
</head>
<body>

    <h2>Scan QR Code</h2>
    <div id="reader"></div>
    <div id="result-box">Success! Redirecting...</div>

    <script>
        function initializeScanner() {
            const resultBox = document.getElementById('result-box');
            
            if (typeof Html5QrcodeScanner !== 'undefined') {
                const html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { fps: 10, qrbox: { width: 250, height: 250 }, rememberLastUsedCamera: true },
                    false
                );
                
                html5QrcodeScanner.render((decodedText) => {
                    resultBox.style.display = "block";
                    
                    // 1. Check if the parent tab (your FlutterFlow app) is open
                    if (window.opener) {
                        try {
                            // Clean the text to make it safe for a website URL
                            const cleanText = encodeURIComponent(decodedText);
                            
                            // Get your current app's live domain link
                            const parentUrl = window.opener.location.href.split('?')[0];
                            
                            // 2. FORCE the main FlutterFlow page to reload with the scanned code attached to the link
                            window.opener.location.href = parentUrl + "?code=" + cleanText;
                        } catch(e) {
                            console.error("Redirect block", e);
                        }
                    }

                    // 3. Close the scanner tab immediately
                    setTimeout(() => { window.close(); }, 300);
                }, (err) => {});
            } else {
                setTimeout(initializeScanner, 250);
            }
        }
        window.addEventListener('load', initializeScanner);
    </script>
</body>
</html>
