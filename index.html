<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web QR Scanner</title>
    
    <!-- FIXED: Using jsDelivr official script to guarantee no more 404 errors -->
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    
    <style>
        body { 
            margin: 0; padding: 20px; background: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box;
        }
        h2 { margin-bottom: 15px; font-weight: 500; font-size: 1.2rem; text-align: center; }
        #reader { 
            width: 100%; max-width: 450px; background: #1e1e1e; 
            border: 2px solid #333333 !important; border-radius: 12px; overflow: hidden;
        }
        #result-box {
            margin-top: 20px; padding: 12px; width: 100%; max-width: 450px;
            background: #2a2a2a; border-radius: 8px; text-align: center;
            font-size: 14px; border: 1px solid #444; word-break: break-all; display: none;
        }
        #error-fallback {
            display: none; text-align: center; max-width: 400px; padding: 20px;
            background: #222; border-radius: 8px; border: 1px solid #ff453a;
        }
    </style>
</head>
<body>

    <div id="scanner-container">
        <h2>Scan QR Code</h2>
        <div id="reader"></div>
    </div>

    <!-- Graceful Error UI instead of a blank screen -->
    <div id="error-fallback">
        <p style="color: #ff453a; margin-top: 0;">⚠️ Camera Access Notice</p>
        <p style="font-size: 14px; color: #bbb;">iOS constraints or permission denials may stop the live feed inside the app frame.</p>
    </div>

    <div id="result-box">Success! Returning to app...</div>

    <script>
        function initializeScanner() {
            const resultBox = document.getElementById('result-box');
            const errorFallback = document.getElementById('error-fallback');
            const scannerContainer = document.getElementById('scanner-container');
            
            // Safety check: Make sure library loaded successfully
            if (typeof Html5QrcodeScanner !== 'undefined') {
                console.log("Library loaded perfectly via jsDelivr CDN!");
                
                const html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 10, 
                        qrbox: { width: 250, height: 250 },
                        rememberLastUsedCamera: true
                    },
                    /* verbose= */ false
                );
                
                html5QrcodeScanner.render(
                    (decodedText) => {
                        resultBox.style.display = "block";
                        
                        // Communicate with the parent tab that opened it
                        if (window.opener) {
                            window.opener.postMessage({ type: 'QR_SCAN_RESULT', data: decodedText }, '*');
                        }

                        // Close popup window after a brief delay
                        setTimeout(() => { window.close(); }, 500);
                    }, 
                    (err) => { /* scanning framework updates */ }
                );
            } else {
                // If CDN fails, display structural warning
                scannerContainer.style.display = "none";
                errorFallback.style.display = "block";
            }
        }

        window.addEventListener('load', initializeScanner);
    </script>
</body>
</html>
