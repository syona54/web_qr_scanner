<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web QR Scanner</title>
    <!-- Load the scanner library via a highly reliable CDN -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { 
            margin: 0; padding: 20px; background: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box;
        }
        h2 { margin-bottom: 10px; font-weight: 500; font-size: 1.2rem; text-align: center; }
        #reader { 
            width: 100%; max-width: 450px; background: #1e1e1e; 
            border: 2px solid #333333 !important; border-radius: 12px; overflow: hidden;
        }
        /* Style the built-in library buttons for easier clicking */
        button {
            background-color: #007aff !important; color: white !important; 
            border: none !important; padding: 10px 20px !important; 
            font-size: 14px !important; border-radius: 8px !important; 
            cursor: pointer !important; margin: 10px auto !important; display: block !important;
        }
        #result-box {
            margin-top: 20px; padding: 12px; width: 100%; max-index: 450px;
            background: #2a2a2a; border-radius: 8px; text-align: center;
            font-size: 14px; border: 1px solid #444; word-break: break-all; display: none;
        }
    </style>
</head>
<body>

    <h2>Scan QR Code</h2>
    <div id="reader"></div>
    <div id="result-box" id="scanned-text">No code detected yet</div>

    <script>
        // Wait for the full browser DOM window to load before initializing the camera
        window.addEventListener('DOMContentLoaded', () => {
            const resultBox = document.getElementById('result-box');
            
            function onScanSuccess(decodedText, decodedResult) {
                // Display the scanned code directly on screen for testing standalone
                resultBox.style.display = "block";
                resultBox.innerText = "Result: " + decodedText;

                // Send the payload back to FlutterFlow window
                window.parent.postMessage({ type: 'QR_SCAN_RESULT', data: decodedText }, '*');
            }

            function onScanFailure(error) {
                // Quietly log scanner frame misfires without breaking the loop
                console.warn(`Scan failure: ${error}`);
            }

            // Create the scanner instance
            const html5QrcodeScanner = new Html5QrcodeScanner(
                "reader", 
                { 
                    fps: 15, 
                    qrbox: { width: 250, height: 250 },
                    rememberLastUsedCamera: true,
                    supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA]
                },
                /* verbose= */ false
            );
            
            html5QrcodeScanner.render(onScanSuccess, onScanFailure);
        });
    </script>
</body>
</html>
