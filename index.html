<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web QR Scanner</title>
    <!-- Use a highly dependable, fixed version CDN to guarantee library loading -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        body { 
            margin: 0; padding: 20px; background: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box;
        }
        h2 { margin-bottom: 15px; font-weight: 500; font-size: 1.2rem; text-align: center; }
        #reader { 
            width: 100%; max-width: 450px; background: #1e1e1e; 
            border: 2px solid #333333 !important; border-radius: 12px; overflow: hidden;
        }
        #result-box {
            margin-top: 20px; padding: 12px; width: 100%; max-width: 450px;
            background: #2a2a2a; border-radius: 8px; text-align: center;
            font-size: 14px; border: 1px solid #444; word-break: break-all; display: none;
        }
    </style>
</head>
<body>

    <h2>Scan QR Code</h2>
    <div id="reader"></div>
    <div id="result-box">No code detected yet</div>

    <script>
        // Ensure everything is fully parsed by the browser engine before running
        window.addEventListener('load', () => {
            const resultBox = document.getElementById('result-box');
            
            function onScanSuccess(decodedText, decodedResult) {
                resultBox.style.display = "block";
                resultBox.innerText = "Result: " + decodedText;

                // Fire payload directly out to the parent FlutterFlow App frame
                window.parent.postMessage({ type: 'QR_SCAN_RESULT', data: decodedText }, '*');
            }

            // Fallback initialization check
            if (typeof Html5QrcodeScanner !== 'undefined') {
                const html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 10, 
                        qrbox: { width: 250, height: 250 },
                        rememberLastUsedCamera: true
                    },
                    /* verbose= */ false
                );
                html5QrcodeScanner.render(onScanSuccess, (err) => {});
            } else {
                console.error("Html5QrcodeScanner script source failed to initialize completely.");
                resultBox.style.display = "block";
                resultBox.innerText = "Error: Library initialization failure. Try refreshing.";
            }
        });
    </script>
</body>
</html>
