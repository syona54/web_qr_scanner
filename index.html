<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web QR Scanner</title>
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        body { 
            margin: 0; padding: 20px; background: #121212; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box;
        }
        h2 { margin-bottom: 15px; font-weight: 500; font-size: 1.2rem; text-align: center; }
        #reader { width: 100%; max-width: 450px; background: #1e1e1e; border-radius: 12px; overflow: hidden; border: 2px solid #333 !important; }
        button {
            background-color: #007aff !important; color: white !important; border: none !important;
            padding: 12px 24px !important; font-size: 15px !important; border-radius: 8px !important;
            cursor: pointer !important; margin: 15px auto !important; display: block !important; font-weight: bold;
        }
        #result-box { margin-top: 20px; padding: 12px; width: 100%; max-width: 450px; background: #2a2a2a; border-radius: 8px; text-align: center; display: none; }
    </style>
</head>
<body>

    <h2>Scan QR Code</h2>
    <div id="reader"></div>
    <div id="result-box">Processing...</div>

    <script>
        function initializeScanner() {
            const resultBox = document.getElementById('result-box');
            
            if (typeof Html5QrcodeScanner !== 'undefined') {
                const html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 10, 
                        qrbox: { width: 250, height: 250 },
                        // FORCE both options: Camera stream for Desktop/Android, Image file for iOS fallback
                        supportedScanTypes: [
                            Html5QrcodeScanType.SCAN_TYPE_CAMERA,
                            Html5QrcodeScanType.SCAN_TYPE_FILE
                        ]
                    },
                    /* verbose= */ false
                );
                
                html5QrcodeScanner.render(
                    (decodedText) => {
                        resultBox.style.display = "block";
                        resultBox.innerText = "Scanned: " + decodedText;
                        window.parent.postMessage({ type: 'QR_SCAN_RESULT', data: decodedText }, '*');
                    }, 
                    (err) => {}
                );
            } else {
                setTimeout(initializeScanner, 250);
            }
        }
        window.addEventListener('load', initializeScanner);
    </script>
</body>
</html>
